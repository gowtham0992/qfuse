name: Host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Callback sanitizers and compiler supervisor
        run: make check
      - name: Audit public source export
        run: |
          python3 scripts/export-public.py build/public
          python3 scripts/source-dist.py
          python3 -m compileall -q scripts
